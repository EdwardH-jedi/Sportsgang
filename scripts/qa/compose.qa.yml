# Local QA stack for hands-on testing (driven by scripts/qa/qa.py).
#
# Separate from the root docker-compose.yml (project `protin`) and from the
# disposable verification stacks: own database, own named volume,
# loopback-only ports. The project name is not set here: qa.py always passes
# `-p <QA_PROJECT>` (default `sportsgang-qa`) after checking that this
# worktree owns that project, so a bare `docker compose -f` never targets the
# shared stack. `qa.py down` stops the containers and keeps the volume, so
# demo data survives. Values come from .qa/config.env (generated locally,
# git-ignored).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sportsgang_qa
      POSTGRES_PASSWORD: ${QA_PG_PASSWORD:?run scripts/qa/qa.py to generate .qa/config.env}
      POSTGRES_DB: sportsgang_qa
    ports: ["127.0.0.1:${QA_PG_PORT:-55470}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportsgang_qa -d sportsgang_qa"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    # Rate-limit counters and pub/sub only; nothing that needs to persist.
    image: redis:7-alpine
    ports: ["127.0.0.1:${QA_REDIS_PORT:-56470}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
