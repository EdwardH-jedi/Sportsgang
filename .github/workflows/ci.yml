name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same ref.
# Keyed by workflow + ref so pushes to different branches don't cancel each
# other; only superseded runs on the same branch/PR are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: PostgreSQL and Redis booking journey
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_ENV: local
      SECRET_KEY: ci-test-secret-key-minimum-32-characters
      POSTGRES_URL: postgresql://protin:protin@localhost:5432/protin_ci
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: protin
          POSTGRES_PASSWORD: protin
          POSTGRES_DB: protin_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U protin -d protin_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"
      - name: Install locked dependencies
        run: uv sync --frozen --dev
      - name: Migrate a fresh PostgreSQL database
        run: uv run alembic upgrade head
      - name: Verify real-service booking flow
        run: uv run pytest tests_integration -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Lint (ruff check + format)
        run: |
          cd apps/api
          uv run ruff check .
          uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -w @protin/mobile

  lint-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -w @protin/mobile

  test-mobile:
    runs-on: ubuntu-latest
    needs: lint-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci -w @protin/mobile

  test:
    # API tests use SQLite in-memory — no external services required.
    runs-on: ubuntu-latest
    needs: lint
    env:
      SECRET_KEY: ci-test-secret-key-minimum-32-characters

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "apps/api/uv.lock"

      - name: Run tests
        run: cd apps/api && uv run pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, typecheck, test-mobile, integration]
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        # The Dockerfile COPYs apps/api/... paths, so the build context must
        # be the repository root (matching fly.toml).
        run: docker build -f apps/api/Dockerfile .
