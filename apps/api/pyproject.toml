[project]
name = "protin-api"
version = "0.1.0"
description = "SportsGang API service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0,<1.0.0",
  # status.HTTP_422_UNPROCESSABLE_CONTENT (used by the service layer) first
  # ships in Starlette 0.48; older releases only have the deprecated name.
  "starlette>=0.48.0,<2.0.0",
  "pydantic[email]>=2.0.0,<3.0.0",
  "pydantic-settings>=2.10.0,<3.0.0",
  "uvicorn[standard]>=0.35.0,<1.0.0",
  "sqlalchemy[asyncio]>=2.0.0,<3.0.0",
  "asyncpg>=0.30.0,<1.0.0",
  "alembic>=1.14.0,<2.0.0",
  "redis>=5.2.0,<6.0.0",
  "cryptography>=42.0.0,<44.0.0",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  # Pin bcrypt<4: passlib 1.7 reads `bcrypt.__about__.__version__`, which
  # bcrypt 4.x removed. Without this pin every /auth/login and /auth/register
  # call fails at password hashing.
  "bcrypt>=3.2.0,<4.0.0",
  "PyJWT>=2.8.0,<3.0.0",
  "httpx>=0.28.0,<1.0.0",
  "slowapi>=0.1.9,<1.0.0",
  # Required by FastAPI's UploadFile/File for multipart/form-data handling
  # used by /users/me/photos.
  "python-multipart>=0.0.20,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "aiosqlite>=0.20.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"alembic/env.py" = ["E402", "I001"]
"alembic/versions/*.py" = ["F401", "E501", "I001"]
"tests/*.py" = ["F401", "E402", "E501", "I001"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]

